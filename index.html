<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiran Kumar Sahoo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- CUSTOM CYBERPUNK CURSOR (Desktop Only) -->
    <div id="cursor"></div>
    <div id="cursorDot"></div>

    <!-- BOOT SEQUENCE OVERLAY -->
    <div id="bootScreen">
      <div id="bootText"></div>
    </div>

    <!-- MOUSE GLOW (Desktop Only) -->
    <div class="mouse-glow" id="mouseGlow"></div>

    <div class="progress"><i id="progressBar"></i></div>

    <!-- ================= HERO ================= -->
    <header class="hero wrap">
      <div class="avatar" id="avatar">KKS</div>
      <div class="hero-text">
        <h1 id="name" class="glitch" data-text="Kiran Kumar Sahoo">
          Kiran Kumar Sahoo
        </h1>
        <p class="role" id="role"></p>
        <p class="bio" id="bio"></p>
        <div class="socials" id="socials"></div>
      </div>
    </header>

    <!-- HOLOGRAPHIC ID SCANNER -->
    <section class="wrap" id="hologramContainer">
      <div class="holo-card" id="holoCard">
        <div class="holo-scanline"></div>
        <div class="holo-header">
          <span class="holo-status">TARGET ACQUIRED</span>
          <span class="holo-crosshair">⊕</span>
        </div>
        <div class="holo-body">
          <div class="holo-data">
            <p>
              SECTOR: <span id="holoCity" class="holo-accent">SCANNING...</span>
            </p>
            <p>
              NODE: <span id="holoDevice" class="holo-accent">SCANNING...</span>
            </p>
            <p>
              TIME: <span id="holoTime" class="holo-accent">SYNCING...</span>
            </p>
          </div>
          <div class="holo-photo">
            <div class="holo-face" id="holoFace"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= MAIN ================= -->
    <main class="wrap grid">
      <!-- LEFT COLUMN: Live Projects -->
      <div class="main-column">
        <div id="liveProjectsCard"></div>
      </div>

      <!-- RIGHT COLUMN: Sidebar -->
      <aside class="sidebar">
        <div class="card side-card reveal" id="mapCard">
          <h3>SYS.TRACKER</h3>
          <div id="cyberMap">
            <div class="map-grid-bg"></div>
            <div class="map-radar"></div>
            <div class="map-reticle"></div>
            <div id="mapContent" class="map-content">
              <button id="scanBtn" class="scan-btn">
                [ INITIATE_GEO_SCAN ]
              </button>
            </div>
          </div>
        </div>

        <!-- SYSTEM STATUS WIDGET -->
        <div class="card side-card reveal" id="statusCard">
          <h3>SYSTEM.STATUS</h3>

          <div class="status-row">
            <span class="status-label">UPLINK</span>
            <span class="status-value online"
              ><span class="blink"></span> ONLINE</span
            >
          </div>

          <div class="status-row">
            <span class="status-label">CURRENT_OP</span>
            <span class="status-value text-accent">Building Next.js App</span>
          </div>

          <div class="status-row">
            <span class="status-label">LEARNING</span>
            <span class="status-value text-accent2">Advanced DSA & TS</span>
          </div>

          <div class="status-row" style="margin-top: 12px; display: block">
            <div
              style="
                display: flex;
                justify-content: space-between;
                margin-bottom: 4px;
              "
            >
              <span class="status-label">NEURAL_LOAD</span>
              <span class="status-label text-accent" id="cpuLoad">78%</span>
            </div>
            <div class="status-bar-bg">
              <div class="status-bar-fill" id="cpuBar" style="width: 78%"></div>
            </div>
          </div>
        </div>

        <div class="card side-card reveal" id="aboutCard"></div>

        <div class="card side-card reveal" id="contactCard">
          <h3>TRANSMIT_MSG</h3>
          <form id="contactForm" class="cyber-form">
            <!-- ⚠️ REPLACE WITH YOUR WEB3FORMS ACCESS KEY -->
            <input
              type="hidden"
              name="access_key"
              value="YOUR_WEB3FORMS_ACCESS_KEY_HERE"
            />
            <input
              type="hidden"
              name="subject"
              value="New Transmission from Portfolio"
            />

            <div class="form-group">
              <label for="formName">IDENTIFIER</label>
              <input
                type="text"
                id="formName"
                name="name"
                placeholder="Your name..."
                required
              />
            </div>

            <div class="form-group">
              <label for="formEmail">RETURN_SIGNAL</label>
              <input
                type="email"
                id="formEmail"
                name="email"
                placeholder="your@email.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="formMessage">PAYLOAD</label>
              <textarea
                id="formMessage"
                name="message"
                rows="3"
                placeholder="Enter message..."
                required
              ></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
              [ SEND_TRANSMISSION ]
            </button>
            <div id="formStatus" class="form-status"></div>
          </form>
        </div>

        <div class="card side-card reveal" id="skillsCard"></div>
        <div class="card side-card reveal" id="timelineCard"></div>
      </aside>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="wrap">
      <p>
        © <span id="year"></span> <span id="footerName"></span> // ALL SYSTEMS
        NOMINAL <span class="heart">♥</span>
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
