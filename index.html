<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiran Kumar Sahoo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- BOOT SEQUENCE OVERLAY -->
    <div id="bootScreen">
      <div id="bootText"></div>
    </div>

    <!-- MOUSE GLOW -->
    <div class="mouse-glow" id="mouseGlow"></div>

    <div class="progress"><i id="progressBar"></i></div>

    <!-- ================= HERO ================= -->
    <header class="hero wrap">
      <div class="avatar" id="avatar">KKS</div>
      <div class="hero-text">
        <h1 id="name" class="glitch" data-text="Kiran Kumar Sahoo">
          Kiran Kumar Sahoo
        </h1>
        <p class="role" id="role"></p>
        <p class="bio" id="bio"></p>
        <div class="socials" id="socials"></div>
      </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="wrap grid">
      <!-- LEFT COLUMN: Live Projects -->
      <div class="main-column">
        <div id="liveProjectsCard"></div>
      </div>

      <!-- RIGHT COLUMN: Sidebar (Map, About, Skills, Timeline) -->
      <aside class="sidebar">
        <!-- Cyberpunk Map Card -->
        <div class="card side-card reveal" id="mapCard">
          <h3>SYS.TRACKER</h3>
          <div id="cyberMap">
            <div class="map-grid-bg"></div>
            <div class="map-radar"></div>
            <div class="map-reticle"></div>
            <div id="mapContent" class="map-content">
              <button id="scanBtn" class="scan-btn">
                [ INITIATE_GEO_SCAN ]
              </button>
            </div>
          </div>
        </div>

        <div class="card side-card reveal" id="aboutCard"></div>
        <div class="card side-card reveal" id="skillsCard"></div>
        <div class="card side-card reveal" id="timelineCard"></div>
      </aside>
    </main>

    <!-- ================= FOOTER ================= -->
    <footer class="wrap">
      <p>
        © <span id="year"></span> <span id="footerName"></span> // ALL SYSTEMS
        NOMINAL <span class="heart">♥</span>
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
