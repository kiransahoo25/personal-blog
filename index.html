<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiran Kumar Sahoo — Personal Blog</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="progress"><i id="progressBar"></i></div>

    <!-- ================= HERO ================= -->
    <header class="hero wrap">
      <div class="avatar" id="avatar">KS</div>
      <div class="hero-text">
        <h1 id="name">Kiran Kumar Sahoo</h1>
        <p class="role" id="role"></p>
        <p class="bio" id="bio"></p>
        <div class="socials" id="socials"></div>
      </div>
    </header>

    <!-- ================= TOOLBAR ================= -->
    <div class="toolbar">
      <div class="wrap toolbar-inner">
        <div class="search">
          <span aria-hidden="true">🔍</span>
          <input
            id="search"
            type="search"
            placeholder="Search posts…  (press /)"
            autocomplete="off"
            aria-label="Search posts"
          />
        </div>
        <div class="chips" id="tags"></div>
        <button class="btn ghost" id="themeBtn" aria-label="Toggle theme">
          🌙 Dark
        </button>
      </div>
    </div>

    <!-- ================= MAIN ================= -->
    <main class="wrap grid">
      <!-- LEFT COLUMN: Live Projects + Posts -->
      <div class="main-column">
        <div class="card side-card reveal" id="liveProjectsCard"></div>
        <section id="posts" aria-live="polite"></section>
      </div>

      <!-- RIGHT COLUMN: Sidebar -->
      <aside class="sidebar">
        <div class="card side-card reveal" id="aboutCard"></div>
        <div class="card side-card reveal" id="skillsCard"></div>
        <div class="card side-card reveal" id="timelineCard"></div>
      </aside>
    </main>

    <footer class="wrap">
      <p>
        © <span id="year"></span> <span id="footerName"></span> · Built with
        plain HTML, CSS &amp; JS <span class="heart">♥</span>
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
